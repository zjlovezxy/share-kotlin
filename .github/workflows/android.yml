name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

env:
  # 只在 job 级 env 里读 secrets —— if 表达式里不能直接用 secrets 上下文
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # push_files 提交的文件不带可执行位，必须自己补
      - name: Fix gradlew permission
        run: chmod +x gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # 全程 tee 到 ci.log，失败时自动回传到 issue（见最后一步）
      - name: Unit tests
        shell: bash
        run: set -o pipefail; ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee -a ci.log

      - name: Build debug
        shell: bash
        run: set -o pipefail; ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee -a ci.log

      # 打 tag 或仓库根有 release-tag.txt 时，把 debug 包整理成可直接安装的产物
      # （用文件而不是 tag，是因为本机没有 PAT，推不了 tag）
      - name: Prepare distributable debug apk
        if: startsWith(github.ref, 'refs/tags/v') || hashFiles('release-tag.txt') != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="$(tr -d '[:space:]' < release-tag.txt 2>/dev/null || true)"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ShareKt-${TAG}-debug.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Decode keystore
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            2>&1 | tee -a ci.log

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || hashFiles('release-tag.txt') != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.apk app/build/outputs/apk/release/*.apk)
          echo "发布 ${TAG}：${files[*]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "ShareKt $TAG" --target "$GITHUB_SHA" --generate-notes
          fi

      # 失败时把日志尾巴贴进 issue，便于在无 token 环境排查
      - name: Report failure to issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('ci.log', 'utf8'); } catch (e) { log = '(ci.log 未生成)'; }
            const lines = log.split('\n');
            // 第一个 "What went wrong" 才是真正的根因，tail 里往往只剩 stacktrace
            const wrongAt = lines.findIndex(l => l.includes('What went wrong'));
            const headAt = wrongAt >= 0 ? wrongAt : Math.max(0, lines.length - 400);
            const head = lines.slice(headAt, headAt + 90).join('\n').slice(-40000);
            // Kotlin/Gradle 的具体报错行（e: file:line:col ...）往往不在根因块里
            const errs = lines.filter(l => /^(e: |w: .*error|> Task .*FAILED|FAILURE: Build failed)/.test(l)).slice(0, 60).join('\n').slice(-20000);
            const tail = lines.slice(-40).join('\n').slice(-12000);
            const TITLE = 'CI 失败日志（自动汇总）';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            let found = open.data.find(i => i.title === TITLE);
            if (!found) {
              const created = await github.rest.issues.create({
                owner, repo, title: TITLE,
                body: '此 issue 由 CI 自动写入，用于汇总失败日志。请勿关闭。'
              });
              found = created.data;
            }
            const body = [
              `### ❌ \`${context.workflow}\` 失败`,
              `- run: [${context.runId}](https://github.com/${owner}/${repo}/actions/runs/${context.runId}) (#${context.runNumber})`,
              `- ref: \`${context.ref}\``,
              `- sha: \`${context.sha.slice(0, 7)}\``,
              '',
              '<details open><summary>根因（What went wrong）</summary>',
              '',
              '```',
              head,
              '```',
              '</details>',
              '',
              '<details open><summary>编译错误行</summary>',
              '',
              '```',
              errs || '(无 e: 行)',
              '```',
              '</details>',
              '',
              '<details><summary>最后 40 行</summary>',
              '',
              '```',
              tail,
              '```',
              '</details>'
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number: found.number, body });
