name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

env:
  # 只在 job 级 env 里读 secrets —— if 表达式里不能直接用 secrets 上下文
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # push_files 提交的文件不带可执行位，必须自己补
      - name: Fix gradlew permission
        run: chmod +x gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # 全程 tee 到 ci.log，失败时自动回传到 issue（见最后一步）
      - name: Unit tests
        shell: bash
        run: set -o pipefail; ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee -a ci.log

      - name: Build debug
        shell: bash
        run: set -o pipefail; ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee -a ci.log

      # 打 tag 时把 debug 包也放进 release：没有签名 secrets 也能直接装
      - name: Prepare distributable debug apk
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ShareKt-${GITHUB_REF_NAME}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Decode keystore
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            2>&1 | tee -a ci.log

      - name: Upload release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # 没有签名 secrets 时 release apk 不存在，只发 debug 包，不让整步失败
          fail_on_unmatched_files: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            dist/*.apk

      # 失败时把日志尾巴贴进 issue，便于在无 token 环境排查
      - name: Report failure to issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('ci.log', 'utf8'); } catch (e) { log = '(ci.log 未生成)'; }
            const tail = log.trimEnd().split('\n').slice(-120).join('\n').slice(-60000);
            const TITLE = 'CI 失败日志（自动汇总）';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            let found = open.data.find(i => i.title === TITLE);
            if (!found) {
              const created = await github.rest.issues.create({
                owner, repo, title: TITLE,
                body: '此 issue 由 CI 自动写入，用于汇总失败日志。请勿关闭。'
              });
              found = created.data;
            }
            const body = [
              `### ❌ \`${context.workflow}\` 失败`,
              `- run: [${context.runId}](https://github.com/${owner}/${repo}/actions/runs/${context.runId}) (#${context.runNumber})`,
              `- ref: \`${context.ref}\``,
              `- sha: \`${context.sha.slice(0, 7)}\``,
              '',
              '<details><summary>最后 120 行</summary>',
              '',
              '```',
              tail,
              '```',
              '</details>'
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number: found.number, body });
